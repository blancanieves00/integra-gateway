<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Integra Centros · Acceso</title>
    <style>
      :root {
        color: #102a43;
        background: #f4f8fb;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(100% - 2rem, 34rem);
        padding: 2.5rem 1.5rem;
        text-align: center;
        background: #fff;
        border: 1px solid #d9e5ee;
        border-radius: 1.25rem;
        box-shadow: 0 1rem 3rem rgb(16 42 67 / 10%);
      }

      .mark {
        display: inline-grid;
        width: 3.5rem;
        height: 3.5rem;
        margin-bottom: 1rem;
        place-items: center;
        color: #fff;
        font-size: 1.5rem;
        font-weight: 800;
        background: #009fe3;
        border-radius: 1rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 6vw, 2.3rem);
        letter-spacing: -0.04em;
      }

      p {
        margin: 0.75rem 0 1.5rem;
        color: #526579;
        line-height: 1.6;
      }

      .status {
        min-height: 1.5rem;
        margin-bottom: 1rem;
        color: #526579;
        font-size: 0.9rem;
      }

      .links {
        display: grid;
        gap: 0.75rem;
      }

      a {
        display: block;
        padding: 0.85rem 1rem;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        background: #009fe3;
        border-radius: 0.7rem;
      }

      a.secondary {
        color: #0b6f9f;
        background: #e5f5fc;
      }

      a:focus-visible {
        outline: 3px solid #102a43;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">I</div>
      <h1>Integra Centros</h1>
      <p>Estamos buscando la ruta más rápida para abrir la web.</p>
      <div class="status" id="status" role="status" aria-live="polite">Comprobando disponibilidad…</div>
      <div class="links">
        <a href="https://integracentros.es/">Abrir la web principal</a>
        <a class="secondary" href="https://integra-centros.netlify.app/">Abrir la copia de respaldo</a>
      </div>
    </main>

    <script>
      const PRIMARY = "https://integracentros.es/";
      const MIRROR = "https://integra-centros.netlify.app/";
      const TIMEOUT_MS = 3500;
      const status = document.querySelector("#status");

      function reachable(url) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), TIMEOUT_MS);

        return fetch(`${url}gateway-check=${Date.now()}`, {
          cache: "no-store",
          mode: "no-cors",
          signal: controller.signal,
        }).finally(() => clearTimeout(timeout));
      }

      Promise.allSettled([reachable(PRIMARY), reachable(MIRROR)]).then(([primary, mirror]) => {
        const destination = primary.status === "fulfilled" ? PRIMARY : mirror.status === "fulfilled" ? MIRROR : null;

        if (!destination) {
          status.textContent = "No se pudo comprobar ninguna ruta. Usa uno de los botones para reintentar.";
          return;
        }

        status.textContent = destination === PRIMARY ? "Web principal disponible. Abriendo…" : "Abriendo la copia de respaldo…";
        window.setTimeout(() => window.location.replace(destination), 250);
      });
    </script>
  </body>
</html>
